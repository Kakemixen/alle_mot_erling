<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The 1</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <!-- Step 1: intro -->
    <section id="intro">
      <h1>You are the <span style="color:var(--accent)">1</span></h1>
      <p class="lead" id="intro-text">Loading…</p>
      <button id="start" hidden>I'm ready — start</button>
      <p class="error" id="intro-error"></p>
    </section>

    <!-- Step 2: questions -->
    <section id="quiz" hidden>
      <div class="progress"><div id="progress-bar"></div></div>
      <p class="muted" id="q-counter"></p>
      <p class="question-text" id="q-text"></p>
      <div class="choices" id="choices"></div>
      <div class="nav-buttons">
        <button class="secondary" id="prev">← Back</button>
        <button id="next" disabled>Next →</button>
      </div>
      <p class="error" id="quiz-error"></p>
    </section>

    <!-- Step 3: done -->
    <section id="done" hidden>
      <h1>Answers locked in! 🔒</h1>
      <p class="lead">Now it's up to everyone else. Fingers crossed!</p>
      <a class="btn" href="/results.html">See the results</a>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="/quiz.js"></script>
  <script>
    // No shared header here: this page is reached only via the secret link.
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(location.search).get("token") || "";

    async function init() {
      if (!token) throw new Error("This page needs the secret link for the 1 — ask the host.");
      const { game, questions } = await api(`/api/play?token=${encodeURIComponent(token)}`);
      if (!questions.length) throw new Error("There are no questions yet — ask the host to create some.");
      $("intro-text").innerHTML = `Welcome, <strong>${esc(game.oneName)}</strong>!
        You're up against everyone. ${questions.length} questions — beat the crowd's average to win.`;
      $("start").hidden = false;
      $("start").onclick = () => {
        $("intro").hidden = true;
        runQuiz(questions, async (answers) => {
          await api("/api/answers", { method: "POST", body: { gameId: game.id, oneToken: token, answers } });
          $("quiz").hidden = true;
          $("done").hidden = false;
        });
      };
    }

    init().catch((err) => {
      $("intro-text").textContent = "";
      $("intro-error").textContent = err.message;
    });
  </script>
</body>
</html>
