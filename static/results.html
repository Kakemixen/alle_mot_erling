<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Results</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <div class="toolbar" style="justify-content:space-between">
      <h1 style="margin:0"><span id="one-name"></span> vs everyone</h1>
      <div class="toolbar">
        <button id="reveal">Reveal answers</button>
        <button class="secondary" id="toggle-one">Link for the 1</button>
        <button class="secondary" id="new-game">New game</button>
      </div>
    </div>
    <p class="players" id="players"></p>

    <div class="join-panels">
      <div class="card join">
        <img id="crowd-qr" alt="QR code to join as a player">
        <div>
          <h2>Join the crowd</h2>
          <p class="muted">Scan to play against <span class="one-name-inline"></span></p>
          <a id="crowd-link" class="link"></a>
        </div>
      </div>
      <div class="card join one" id="one-panel" hidden>
        <img id="one-qr" alt="QR code for the 1">
        <div>
          <h2>Only for <span class="one-name-inline"></span></h2>
          <p class="muted">Secret link — hide this before showing the screen to the crowd.</p>
          <a id="one-link" class="link" target="_blank"></a>
          <div style="margin-top:10px"><button class="secondary" id="copy-one">Copy link</button></div>
        </div>
      </div>
    </div>

    <div class="card" id="scoreboard"></div>
    <div id="questions"></div>
  </main>

  <script src="/common.js"></script>
  <script>
    renderHeader("results");

    const $ = (id) => document.getElementById(id);
    let revealed = false, lastGameId = null;

    $("reveal").onclick = () => {
      revealed = !revealed;
      $("reveal").textContent = revealed ? "Hide answers" : "Reveal answers";
      load();
    };

    const qrSrc = (url) => `/api/qr.svg?data=${encodeURIComponent(url)}`;

    async function loadLinks() {
      const links = await api("/api/links");
      $("crowd-qr").src = qrSrc(links.crowd);
      $("crowd-link").textContent = $("crowd-link").href = links.crowd;
      $("one-qr").src = qrSrc(links.one);
      $("one-link").textContent = $("one-link").href = links.one;
    }

    $("toggle-one").onclick = () => {
      $("one-panel").hidden = !$("one-panel").hidden;
      $("toggle-one").textContent = $("one-panel").hidden ? "Link for the 1" : "Hide link for the 1";
    };

    $("copy-one").onclick = async () => {
      try {
        await navigator.clipboard.writeText($("one-link").href);
        $("copy-one").textContent = "Copied!";
      } catch {
        prompt("Copy this link:", $("one-link").href);
      }
      setTimeout(() => ($("copy-one").textContent = "Copy link"), 1500);
    };

    $("new-game").onclick = async () => {
      const current = $("one-name").textContent;
      const name = prompt("Who is the 1 in the new game?", current);
      if (!name || !name.trim()) return;
      await api("/api/game", { method: "POST", body: { oneName: name.trim() } });
      load();
    };

    function renderScoreboard(r) {
      const { one, crowd, total } = r.score;
      const anyCrowd = r.crowdPlayers.length > 0;
      let banner = "";
      if (revealed && r.oneHasAnswered && anyCrowd) {
        banner = one > crowd ? `🏆 ${esc(r.game.oneName)} beats everyone!`
               : one < crowd ? "🏆 Everyone wins!"
               : "🤝 It's a draw!";
      }
      $("scoreboard").innerHTML = `
        <div class="versus">
          <div class="side one">
            <div class="muted">The 1</div>
            <div><strong>${esc(r.game.oneName)}</strong></div>
            <div class="score">${revealed ? one : "?"}</div>
            <div class="muted">${r.oneHasAnswered ? "has answered" : "waiting…"}</div>
          </div>
          <div class="vs">VS</div>
          <div class="side crowd">
            <div class="muted">Everyone</div>
            <div><strong>${r.crowdPlayers.length} player${r.crowdPlayers.length === 1 ? "" : "s"}</strong></div>
            <div class="score">${revealed ? crowd.toFixed(1) : "?"}</div>
            <div class="muted">avg. correct of ${total}</div>
          </div>
        </div>
        ${banner ? `<p class="winner-banner">${banner}</p>` : ""}`;
    }

    function renderQuestion(q, i, oneName) {
      const max = Math.max(1, ...q.counts);
      const bars = q.options.map((o, j) => {
        const correct = revealed && j === q.correctIndex;
        const pct = q.crowdTotal ? Math.round((q.counts[j] / q.crowdTotal) * 100) : 0;
        const oneTag = revealed && q.oneChoice === j ? `<span class="pill one">${esc(oneName)}</span>` : "";
        return `
          <div class="bar-row ${correct ? "correct" : ""}">
            <div class="label"><strong>${"ABCDEF"[j]}.</strong> ${esc(o)} ${correct ? "✔" : ""}${oneTag}</div>
            <div class="bar"><div style="width:${revealed ? (q.counts[j] / max) * 100 : 0}%"></div></div>
            <div class="muted">${revealed ? `${pct}%` : ""}</div>
          </div>`;
      }).join("");

      let verdict = "";
      if (revealed) {
        const onePill = q.oneCorrect === null ? `<span class="pill">no answer</span>`
          : q.oneCorrect ? `<span class="pill ok">correct</span>` : `<span class="pill no">wrong</span>`;
        const crowdTxt = q.crowdCorrectPct === null ? "no answers yet"
          : `${Math.round(q.crowdCorrectPct)}% correct`;
        verdict = `<p class="muted">${esc(oneName)}: ${onePill} &nbsp;·&nbsp; Everyone: ${crowdTxt}</p>`;
      }

      return `
        <div class="card">
          <p class="muted" style="margin:0">Question ${i + 1} · ${q.crowdTotal} crowd answer${q.crowdTotal === 1 ? "" : "s"}</p>
          <h2 style="margin:6px 0 12px">${esc(q.text)}</h2>
          ${bars}
          ${verdict}
        </div>`;
    }

    async function load() {
      const r = await api("/api/results");
      if (r.game.id !== lastGameId) {
        if (lastGameId !== null && revealed) {
          revealed = false;
          $("reveal").textContent = "Reveal answers";
        }
        loadLinks(); // new game → new secret link for the 1
      }
      lastGameId = r.game.id;
      $("one-name").textContent = r.game.oneName;
      document.querySelectorAll(".one-name-inline").forEach((el) => (el.textContent = r.game.oneName));
      $("players").textContent = r.crowdPlayers.length
        ? `Playing: ${r.crowdPlayers.join(", ")}`
        : "No one from the crowd has answered yet — open the Play page on your phones.";
      renderScoreboard(r);
      $("questions").innerHTML = r.questions.map((q, i) => renderQuestion(q, i, r.game.oneName)).join("")
        || `<p class="muted">No questions yet — add some on the Create page.</p>`;
    }

    load();
    setInterval(load, 3000); // live update while people are answering
  </script>
</body>
</html>
