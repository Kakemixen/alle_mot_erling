# Example nginx site for the quiz, in front of gunicorn on 127.0.0.1:8000.
# Replace quiz.example.com and the certificate paths (e.g. from Let's Encrypt:
# `certbot --nginx -d quiz.example.com`), then put this in
# /etc/nginx/sites-available/ and enable it.
#
# HTTPS is worth it here: the host login is only encrypted with HTTPS, and
# HTTP/2 lets one browser keep many quiz tabs open (no ~6-connection limit).

server {
    listen 80;
    server_name quiz.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name quiz.example.com;

    ssl_certificate     /etc/letsencrypt/live/quiz.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live updates (Server-Sent Events): long-lived responses that must be
    # passed on immediately, not buffered.
    location /api/events {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
